<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClubMatcher</title>
    <style>
         :root {
            --bg: #eaf7f7;
            --panel: #ffffff;
            --primary: #2d8c8c;
            --primary-dark: #1f6f73;
            --text: #12313b;
            --muted: #5f7a7d;
            --border: #b9dfe3;
            --success: #2f8f73;
        }
        
        * {
            box-sizing: border-box;
            .box {
                border-radius: 8px;
            }
        }
        
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #d7f0ee, #eef9f8);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }
        
        .brand {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10;
            width: 180px;
            max-width: calc(100vw - 36px);
        }
        
        .brand img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        
        .container {
            width: min(92vw, 700px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(31, 41, 55, 0.08);
            padding: 32px;
        }
        
        h1 {
            margin: 0 0 20px;
            font-size: 2rem;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        select,
        button {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            font-size: 1rem;
        }
        
        select {
            background: #f2fbfb;
            color: var(--text);
            margin-bottom: 16px;
        }
        
        button {
            background: var(--primary);
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        
        button:hover {
            background: var(--primary-dark);
        }
        
        .results {
            margin-top: 28px;
        }
        
        .results h2 {
            font-size: 1.25rem;
            margin-bottom: 12px;
        }
        
        #club-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 12px;
        }
        
        .club-item {
            background: #f6fbfb;
            border: 1px solid var(--border);
            border-left: 6px solid var(--success);
            padding: 14px 16px;
            font-weight: 600;
            color: var(--text);
        }
        
        .club-name {
            display: block;
        }
        
        .club-tag {
            display: inline-block;
            margin: 8px 6px 0 0;
            padding: 4px 8px;
            background: #e3f3f2;
            color: var(--primary-dark);
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .empty {
            color: var(--muted);
            font-style: italic;
        }
    </style>
</head>

            setting: "team"
        }];


        const interestSelect = document.getElementById("interest");
        const activitySelect = document.getElementById("activity");
        const settingSelect = document.getElementById("setting");
        const genderSelect = document.getElementById("gender");
        const raceSelect = document.getElementById("race");
        const gradeSelect = document.getElementById("grade");
        const matchButton = document.getElementById("match-btn");
        const clubList = document.getElementById("club-list");

        const clubDetails = {
            "Black Student Union": {
                tags: ["Black community"],
                interests: ["culture"],
                race: "black"
            },
            "Brazilian Student Union": {
                tags: ["Brazilian community"],
                interests: ["culture"],
                race: "brazilian"
            },
            "Chinese Student Association": {
                tags: ["Chinese community"],
                interests: ["culture"],
                race: "asian"
            },
            "Desi Dance Club": {
                tags: ["Desi community"],
                interests: ["culture", "performance", "music"],
                activities: ["perform"],
                race: "desi"
            },
            "Desi Student Association": {
                tags: ["Desi community"],
                interests: ["culture"],
                race: "desi"
            },
            "Gender Sexuality Alliance": {
                tags: ["LGBTQ+ community"],
                race: ""
            },
            "Hispanic Heritage Society": {
                tags: ["Hispanic and Latino community"],
                interests: ["culture"],
                race: "hispanic-latino"
            },
            "Jewish Student Union (JSU)": {
                tags: ["Jewish community"],
                interests: ["culture"],
                race: "jewish"
            },
            "Pakistani Student Association": {
                tags: ["Pakistani community", "South Asian community"],
                interests: ["culture"],
                race: "pakistani"
            },
            "South Asian Students Association (SASA)": {
                tags: ["South Asian community"],
                interests: ["culture"],
                race: "south-asian"
            },
            "Muslim Student Association": {
                tags: ["Muslim community"],
                interests: ["culture"],
                race: "muslim"
            },
            "Latin Club": {
                tags: ["Latin language and culture"],
                interests: ["culture", "academics"],
                race: "latin"
            },
            "French Club": {
                tags: ["French language and culture"],
                interests: ["culture"],
                race: "french"
            },
            "International/Trivia Club": {
                tags: ["International cultures"],
                interests: ["culture", "academics"],
                race: "international"
            },
            "Creative Writing Club": {
                tags: ["Writing"],
                interests: ["literature"],
                activities: ["write"]
            },
            "Literary Magazine Club": {
                tags: ["Writing and publishing"],
                interests: ["literature"],
                activities: ["write"]
            },
            "Writing Center": {
                tags: ["Writing support"],
                interests: ["literature"],
                activities: ["write", "help"]
            },
            "ROBOTICS (Blue Cheese)": {
                tags: ["Robotics and engineering"],
                interests: ["engineering"],
                activities: ["build"],
                setting: "hands-on"
            },
            "TSA (Technology Student Association)": {
                tags: ["Technology and engineering"],
                interests: ["engineering"],
                activities: ["build"],
                setting: "hands-on"
            },
            "Computer Club": {
                tags: ["Technology"],
                interests: ["engineering"],
                setting: "hands-on"
            },
            "Medical Club": {
                tags: ["Health and wellness"],
                interests: ["health"],
                activities: ["research"]
            },
            "Medical Impact Club": {
                tags: ["Health service"],
                interests: ["health"],
                activities: ["research", "volunteer"]
            },
            "Active Minds": {
                tags: ["Mental health and wellness"],
                interests: ["health"]
            },
            "Marching Band": {
                tags: ["Music and performance"],
                interests: ["music", "performance"],
                activities: ["perform"]
            },
            "TRI-M NATIONAL MUSIC HONOR SOCIETY": {
                tags: ["Music"],
                interests: ["music"],
                activities: ["perform"]
            },
            "Drama Club": {
                tags: ["Theater and performance"],
                interests: ["performance"],
                activities: ["perform"]
            }
        };

        matchButton.addEventListener("click", () => {
                    clubList.replaceChildren();

                    const answers = [
                        interestSelect.value,
                        activitySelect.value,
                        settingSelect.value
                    ].filter(Boolean);

                    const hasPreference = Boolean(genderSelect.value || raceSelect.value);

                    if (answers.length === 0 && !hasPreference && !gradeSelect.value) {
                        const message = document.createElement("li");
                        message.className = "empty";
                        message.textContent =
                            "Please answer at least one question to see your matches.";
                        clubList.appendChild(message);
                        return;
                    }

                    const rankedClubs = clubs
                        .map((club) => {
                            const details = clubDetails[club.name] || {};
                            const answerScore = answers.reduce((total, answer) => {
                                const matches =
                                    (club.interests || []).includes(answer) ||
                                    (details.interests || []).includes(answer) ||
                                    (club.activities || []).includes(answer) ||
                                    (details.activities || []).includes(answer) ||
                                    club.setting === answer ||
                                    details.setting === answer;
                                return total + Number(matches);
                            }, 0);

                            const communityMatch =
                                (genderSelect.value && club.gender === genderSelect.value) ||
                                (raceSelect.value && (club.race || details.race) === raceSelect.value);

                            return {
                                club,
                                details,
                                score: answerScore + Number(Boolean(communityMatch))
                            };
                        })
                        .filter(({
                            club,
                            score
                        }) => {
                            const gradeMatch = !gradeSelect.value ||
                                !club.grades ||
                                club.grades.includes(gradeSelect.value);

                            return (answers.length === 0 || score > 0) && gradeMatch;
                        })
                        .sort((a, b) =>
                            b.score - a.score || a.club.name.localeCompare(b.club.name)
                        );

                    if (rankedClubs.length === 0) {
                        const item = document.createElement("li");
                        item.className = "empty";
                        item.textContent = "No clubs match those answers yet.";
                        clubList.appendChild(item);
                        return;
                    }

                    rankedClubs.forEach(({
                                club,
                                score,
                                details
                            }) => {
                                const item = document.createElement("li");
                                item.className = "club-item";

                                const name = document.createElement("span");
                                name.className = "club-name";
                                name.textContent =
                                    `${club.name}${answers.length || hasPreference
                            ? ` — ${score} matching answer${score === 1 ? "" : "s"}`
                            : ""}`;
                    item.appendChild(name);

                    (details.tags || []).forEach((tagText) => {
                        const tag = document.createElement("span");
                        tag.className = "club-tag";
                        tag.textContent = tagText;
                        item.appendChild(tag);
                    });

                    clubList.appendChild(item);
                });
            });
    </script>
</body>

</html>
